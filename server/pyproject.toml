[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gemini-knowledge-rag"
version = "0.1.0"
description = "A citation-first internal knowledge assistant using Gemini and pgvector"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.116.1",
  "google-genai==2.14.0",
  "pgvector==0.4.1",
  "psycopg[binary]==3.2.9",
  "pydantic-settings==2.10.1",
  "pymupdf==1.26.3",
  "python-multipart==0.0.20",
  "sqlalchemy==2.0.43",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
