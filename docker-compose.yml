services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: rag
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    ports:
      - "5432:5432"

  server:
    build:
      context: ./server
    env_file:
      - ./server/.env
    environment:
      DATABASE_URL: postgresql+psycopg://rag:rag@db:5432/rag
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/data/uploads
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        RAG_API_URL: http://server:8000
    environment:
      RAG_API_URL: http://server:8000
    depends_on:
      - server
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  uploads:
